name: Security audit

on:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  push:
    branches: [ main ]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  schedule:
    - cron: "0 4 * * 1"    # každé pondělí 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Cache jen binárku cargo-audit, instalace je pak okamžitá
      - name: Cache cargo-audit binary
        id: cache-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-v0.21.2

      - name: Install cargo-audit (if needed)
        if: steps.cache-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked

      - name: Update RustSec advisory DB
        run: cargo audit update

      # Ignorujeme pouze RUSTSEC-2023-0071 (mysql/rsa); ostatní zůstává striktní
      - name: Run cargo-audit
        run: cargo audit --deny-warnings --ignore RUSTSEC-2023-0071
