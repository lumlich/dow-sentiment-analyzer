[package]
name = "dow-sentiment-analyzer"
version = "0.4.0"
edition = "2021"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "dow-sentiment-analyzer"
path = "src/main.rs"

[features]
default = []
ingest-fixtures = []
ingest-http = []
strict-e2e = []
strict-metrics = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = "0.3"
mime_guess = "2"

# axum/tower must be in [dependencies] (not only dev-dependencies).
axum = { version = "0.8", features = ["macros", "json", "tokio", "http1", "query", "original-uri", "matched-path", "form"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "set-header", "compression-full", "limit"] }
http = "1"
reqwest = { version = "0.12", default-features = true, features = ["json"] }
async-trait = "0.1"

# Shuttle 0.56.x
shuttle-runtime = "0.56.0"
shuttle-axum   = "0.56.0"
# NEW: Shared Postgres JSON store (OpenDAL) for "last decision"
shuttle-shared-db = { version = "0.57.0", features = ["postgres", "opendal-postgres"] }

anyhow = "1.0.100"
metrics = "0.24.2"
metrics-exporter-prometheus = "0.17.2"
regex = "1.11.2"
once_cell = "1.21.3"
dashmap = "6.1.0"
sha2 = "0.10.9"
chrono = "0.4.42"
toml = "0.9.7"
quick-xml = { version = "0.38.3", features = ["serialize"] } # Enable Serde integration for `quick-xml::de`.
time = { version = "0.3.44", features = ["formatting", "parsing"] } # Enable parsing/formatting APIs (OffsetDateTime::parse, format_description).
strsim = "0.11.1"
html-escape = "0.2.13"
lettre = { version = "0.11.18", features = ["tokio1", "builder", "smtp-transport", "tokio1-native-tls"] } # Use Tokio with native-tls over SMTP.
tempfile = "3.22.0"
feed-rs = "2.3.1"

[dev-dependencies]
serial_test = "3.2.0"
rand = "0.8"
