name: Security audit

on:
  # manuální spuštění z UI
  workflow_dispatch:
  # jen když se mění závislosti
  push:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  # týdenní běh (Po 06:00 UTC)
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-audit binary
        id: cache-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-v0.21.2

      - name: Install cargo-audit (if missing)
        if: steps.cache-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked

      # Pozn.: 'cargo audit' si advisory DB stáhne sám; krok 'update' není potřeba
      - name: Run cargo-audit (ignore mysql/rsa only)
        run: |
          set -euo pipefail
          cargo audit --ignore RUSTSEC-2023-0071
