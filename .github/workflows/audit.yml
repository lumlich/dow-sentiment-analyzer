name: Security audit

on:
  # manuální spuštění z karty Actions
  workflow_dispatch:
  # běž jen když se v PR mění Cargo.* (rychlé)
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  # jednou týdně v Po 04:00 UTC
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # zrychlení instalace nástrojů + advisory DB
      - name: Cache cargo registries & tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/.cargo/advisory-db
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-audit-

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Pozn.: cargo-audit si advisory DB aktualizuje samo; explicitní "update" netřeba
      - name: Run cargo audit (ignore MySQL/RSA advisory)
        run: |
          cargo audit --deny warnings --ignore RUSTSEC-2023-0071
