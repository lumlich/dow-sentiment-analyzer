name: CI

on:
  push:
    branches: [ main, develop, 'release/**' ]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.svg'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      toolchain:
        description: "Rust toolchain (stable/beta/nightly or version)"
        required: false
        default: "stable"

permissions:
  contents: read

# Jednotné prostředí
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # pro skripty, které očekávají proměnnou "toolchain"
  toolchain: ${{ github.event.inputs.toolchain != '' && github.event.inputs.toolchain || 'stable' }}

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt (check)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.toolchain }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-features -- -D warnings

  test:
    name: cargo test (all features)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - run: cargo test --workspace --all-features -- --nocapture

  build:
    name: cargo build --release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release

  gate:
    if: ${{ always() }}
    needs: [fmt, clippy, test, build]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "fmt    : ${{ needs.fmt.result }}"
          echo "clippy : ${{ needs.clippy.result }}"
          echo "test   : ${{ needs.test.result }}"
          echo "build  : ${{ needs.build.result }}"
          if [ "${{ needs.fmt.result }}" != "success" ] || \
             [ "${{ needs.clippy.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "One or more jobs failed ❌"
            exit 1
          fi
          echo "All prerequisite jobs succeeded ✅"
